name: SSDLC Code Security Analysis
description: |
  Workflow file for running code security analysis actions on private and
  internal repos. Runs zizmor (GitHub Actions security) and Semgrep CE
  (application source security). Findings surface as workflow annotations on
  the PR diff; the job fails when ERROR-severity Semgrep findings are present.

on:
  workflow_call:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      
      # reference: https://github.com/grafana/security-github-actions/blob/main/.github/workflows/self-zizmor.yaml
      - name: Check for github actions workflow files
        id: github-actions-check
        shell: bash
        run: |
          CAN_RUN_ZIZMOR=false
          SEARCH=$(find . -path "**/.github/workflows/*.yml" -o -path "**/.github/workflows/*.yaml" -o -path "**/action.yml" -o -path "**/action.yaml")
          if [ -n "$SEARCH" ]; then
              CAN_RUN_ZIZMOR=true
          fi
          echo "can-run-zizmor=${CAN_RUN_ZIZMOR}" >> $GITHUB_OUTPUT

      - name: Github actions security analysis using zizmor
        if: ${{ steps.github-actions-check.outputs.can-run-zizmor == 'true' }}
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          annotations: true
          advanced-security: false
          min-severity: high
          min-confidence: high
          fail-on-no-inputs: false

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install --no-cache-dir semgrep==1.168.0

      # No GHAS on private repos — emit findings as workflow annotations on the
      # diff, and fail the job on ERROR-severity findings so the ruleset blocks
      # the PR when enforcement is Active. Repo admins can bypass.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/security-audit \
            --severity ERROR \
            --error \
            --metrics=off \
            --disable-version-check \
            .
